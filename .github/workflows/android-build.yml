name: WAFA InboxAI — Android CI & Real Debug APK Build

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - '.build-outputs/**'
      - 'APK_DOWNLOAD/**'
      - 'README.md'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate-apk:
    name: Build, Test & Validate Real Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Ensure debug keystore exists for signing
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=WAFA InboxAI,C=US"
          fi

      - name: Run Unit & Robolectric Tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Assemble Real Debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Locate, Copy & Validate Real APK
        id: validate_apk
        run: |
          set -euo pipefail
          APK_PATH="$(find app/build/outputs/apk/debug -maxdepth 2 -name '*.apk' | head -n 1)"
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Real debug APK not found after assembleDebug."
            exit 1
          fi
          echo "Located APK: $APK_PATH"

          mkdir -p .build-outputs APK_DOWNLOAD
          cp "$APK_PATH" .build-outputs/app-debug.apk
          cp "$APK_PATH" APK_DOWNLOAD/app-debug.apk

          ls -lh .build-outputs/app-debug.apk APK_DOWNLOAD/app-debug.apk
          file APK_DOWNLOAD/app-debug.apk

          APK_SIZE="$(stat -c%s APK_DOWNLOAD/app-debug.apk)"
          echo "APK size (bytes): $APK_SIZE"
          if [ "$APK_SIZE" -lt 1000000 ]; then
            echo "ERROR: APK size ($APK_SIZE bytes) is unexpectedly small."
            exit 1
          fi

          unzip -t APK_DOWNLOAD/app-debug.apk > /dev/null
          echo "ZIP/APK archive integrity test: PASSED"

          HASH_A="$(sha256sum .build-outputs/app-debug.apk | awk '{print $1}')"
          HASH_B="$(sha256sum APK_DOWNLOAD/app-debug.apk | awk '{print $1}')"
          echo "SHA256 (.build-outputs): $HASH_A"
          echo "SHA256 (APK_DOWNLOAD):   $HASH_B"
          if [ "$HASH_A" != "$HASH_B" ]; then
            echo "ERROR: SHA256 mismatch between copied APKs!"
            exit 1
          fi
          echo "sha256=$HASH_B" >> "$GITHUB_OUTPUT"

      - name: Upload Real Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: wafa-inboxai-debug-apk
          path: APK_DOWNLOAD/app-debug.apk
          if-no-files-found: error

      - name: Publish Verified APK to Repository Code Browser
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .build-outputs/app-debug.apk APK_DOWNLOAD/app-debug.apk
          git diff --cached --quiet || git commit -m "build: update verified debug APK [skip ci]"
          git push

  build-release-apk:
    name: Build Release APK (Optional Signed Release)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Decode Release Keystore & Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Skipping signed release build: KEYSTORE_BASE64 secret not configured."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          gradle :app:assembleRelease --stacktrace
          rm -f my-upload-key.jks
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: wafa-inboxai-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
